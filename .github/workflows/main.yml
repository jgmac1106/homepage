name: Validate website source
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore and verify the public archive catalog
        run: python3 tools/restore_catalog.py
      - name: Validate collections and archive data
        run: python3 tools/validate_sync.py
# No deployment: Reclaim is authoritative. Review live differences before uploading edits.
